                </div>


                <div className="student-home-input">
                    <label for="code">Code</label>
                    <input type="text" id="code" placeholder="Enter your exam code">
                </div>
                <button className="student-home-exam-button">Take Exam</button>
            </div>

                    <span className="history-label">Type</span>
