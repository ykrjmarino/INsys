<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Container Layout</title>
  <link rel="stylesheet" href="create.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!--sa mga ginamit kong icons-->
</head>
<body>
  <!-- whole start-->
  <div class="ancestor">



    <!-- header start -->
    <div class="header">
      <div class="left-group">
        <button class="back-button">&lt;</button>
        <input type="text" class="exam-title" placeholder="Enter Title Exam">
        <button class="header-save-button">Save</button>
        <input type="text" class="exam-code" placeholder="Exam Code">
        <button class="randomize-button"><i class="fa-solid fa-arrow-rotate-left"></i></button>
      </div>
       <label class="create-exam-status">Status:</label>
      <button class="publish-button">Publish</button>
    </div>
    <!-- header end -->




    <!-- main content (nanay ni question and tools container) start -->
    <div class="main-content">


      <!-- question item -->
      <div class="question-container">
        <label class="question-label">Question</label>



        <!-- multiple choice start -->
        <div class="nested-container">
          <label class="question-type-label">Question Type:</label>
          <select class="question-type-dropdown">
            <option value="multiple-choice">Multiple Choice</option>
            <option value="true-false">True or False</option>
            <option value="identification">Identification</option>
          </select>
          <div class="button-group">
            <button class="save-button"><i class="fa-solid fa-floppy-disk"></i></button>
            <button class="delete-button"><i class="fa-solid fa-trash"></i></button>
          </div>
          <textarea class="exambox" placeholder="Enter Question"></textarea>
          <label class="choices-label">Choices:</label>
          <div class="option-inputs">
            <input type="text" class="option-input" placeholder="Option 1">
            <input type="text" class="option-input" placeholder="Option 2">
            <input type="text" class="option-input" placeholder="Option 3">
            <input type="text" class="option-input" placeholder="Option 4">
          </div>
          <label class="correct-answer-label">Correct Answer:</label>
          <input type="text" class="correct-answer-input" placeholder="Set Correct Answer">
        </div>
        <!-- multiple choicee end-->



        <!-- true or false start-->
        <div class="tf-container">
          <label class="question-type-label">Question Type:</label>
          <select class="question-type-dropdown">
            <option value="multiple-choice">Multiple Choice</option>
            <option value="true-false">True or False</option>
            <option value="identification">Identification</option>
          </select>
          <div class="button-group">
            <button class="save-button"><i class="fa-solid fa-floppy-disk"></i></button>
            <button class="delete-button"><i class="fa-solid fa-trash"></i></button>
          </div>
          <textarea class="exambox" placeholder="Enter Question"></textarea>
          <label class="choices-label">True or False:</label> <!--PALITAN MO NLNG TO HAHAH, KUNG MAY MAS BAGAY -->
          <select class="tf-dropdown">
            <option value="true">True</option>
            <option value="false">False</option>
          </select>
        </div>
        <!-- true or false end-->



        <!-- identification start -->
        <div class="identification-container">
          <label class="question-type-label">Question Type:</label>
          <select class="question-type-dropdown">
            <option value="multiple-choice">Multiple Choice</option>
            <option value="true-false">True or False</option>
            <option value="identification">Identification</option>
          </select>
          <div class="button-group">
            <button class="save-button"><i class="fa-solid fa-floppy-disk"></i></button>
            <button class="delete-button"><i class="fa-solid fa-trash"></i></button>
          </div>
          <textarea class="exambox" placeholder="Enter Question"></textarea>
          <label class="choices-label">Identification:</label> 
          <input type="text" class="identification-input" placeholder="Enter Answer">
        </div>
        <button class="add-question-button"><i class="fa-solid fa-plus"></i> Add Question</button>
      </div>
      <!-- identification end-->



      <!-- tools container start -->
      <div class="tools-container">
        <label class="tool-label">Tools</label>



                    <!-- first container (select-section) (selected section) start-->
                    <div class="select-container">
                      <label class="select-label">Select</label>
                      <div class="dropdown-group">
                        <select class="department-dropdown">
                          <option value="BSIT">BSIT</option>
                          <option value="BSIS">BSIS</option>
                          <option value="BSCS">BSCS</option>
                        </select>
                        <select class="year-dropdown">
                          <option value="1st">1st</option>
                          <option value="2nd">2nd</option>
                          <option value="3rd">3rd</option>
                          <option value="4th">4th</option>
                        </select>

                        <div class="section-dropdown">
                          <button class="dropdown-toggle">Section</button>
                          <div class="dropdown-menu">
                            <label><input type="checkbox" value="A"> A</label>
                            <label><input type="checkbox" value="B"> B</label>
                            <label><input type="checkbox" value="C"> C</label>
                            <label><input type="checkbox" value="D"> D</label>
                            <label><input type="checkbox" value="E"> E</label>
                            <label><input type="checkbox" value="F"> F</label>
                            <label><input type="checkbox" value="G"> G</label>
                            <label><input type="checkbox" value="H"> H</label>
                            <label><input type="checkbox" value="I"> I</label>
                            <label><input type="checkbox" value="J"> J</label>
                            <label><input type="checkbox" value="K"> K</label>
                            <label><input type="checkbox" value="L"> L</label>
                            <label><input type="checkbox" value="M"> M</label>
                          </div>
                        </div>
                      </div>
                      <button class="save-section-button">Save</button>
                      <!--pinalitan ko name niya, "second-container" to "list-container"-->
                      <div class="list-container">
                        <label class="select-label">Selected Section</label>
                      </div>
                    </div>
                    <!-- first container (select-section) (selected section) start-->



                    <!-- second container (select-date) start -->
                    <div class="set-time-container">
                      <label class="select-label">Set Duration / Time and Date</label>
                      <div class="duration-container">
                        <label class="duration-label">Duration:</label>
                        <select class="duration-hours">
                          <option value="0">0 hr</option>
                          <option value="1">1 hr</option>
                          <option value="2">2 hr</option>
                          <option value="3">3 hr</option>
                          <option value="4">4 hr</option>
                          <option value="5">5 hr</option>
                        </select>
                        <select class="duration-minutes">
                          <option value="0">0 min</option>
                          <option value="15">15 min</option>
                          <option value="30">30 min</option>
                          <option value="45">45 min</option>
                          <option value="60">60 min</option> 
                        </select>
                        <button class="save-duration-button">Save</button>
                      </div>
                      <div class="time-container">
                        <label class="time-label">Set Time:</label>
                        <input type="time" class="time-picker">
                        <label class="end-time-label">End Time:</label>
                        <input type="time" class="end-time-picker">
                      </div>
                      <div class="date-container">
                        <label class="date-label">Set Date:</label>
                        <input type="date" class="date-picker">
                      </div>
                    </div>
                    <!-- second container end-->


                        <!-- third container (selected-date) start -->
                          <div class="display-date-container">
                            <label class="select-label">Selected Time</label>
                            <div class="date-time-group">
                              <label class="date-time-label">Start Date/Time -</label>
                              <label class="date-time-label">End Date/Time -</label>
                            </div>
                          </div>
                        <!-- third container (selected-date) start -->



        <!-- tool conatiner end -->         
       </div>

      <!-- main content end -->
    </div>

    <!-- whole end -->>
  </div>


</body>
</html>


  <script>
      // sa drop down
      document.querySelector('.dropdown-toggle').addEventListener('click', function() {
        const menu = document.querySelector('.dropdown-menu');
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
      });

     // Close dropdown when clicking outside
      document.addEventListener('click', function(event) {
        const dropdown = document.querySelector('.section-dropdown');
        if (!dropdown.contains(event.target)) {
          document.querySelector('.dropdown-menu').style.display = 'none';
        }
      });
    </script>
