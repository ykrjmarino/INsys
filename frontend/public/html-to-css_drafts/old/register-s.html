<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="student_regis.css">
</head>
<body>
    <div class="page-s-registration">
        <div class="container" id="registration-container">
            <h1>Registration</h1>
            <form id="registration-form">
                <button type="button" class="back-button">←</button>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your Email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your Password" required>
                </div>
                <div class="form-group">
                    <label for="retype-password">Retype Password</label>
                    <input type="password" id="retype-password" name="retype-password" placeholder="Retype Password" required>
                </div>
                <div class="name-group">
                    <div class="form-group">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name" placeholder="Enter First Name" required>
                    </div>
                    <div class="form-group">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name" placeholder="Enter Last Name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <div class="radio-group">
                        <input type="radio" id="male" name="gender" value="male" required>
                        <label for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Female</label>
                        <input type="radio" id="other" name="gender" value="other">
                        <label for="other">Other</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="options">College Department</label>
                    <select id="options" name="options" required>
                        <option value="" disabled selected>College Department</option>
                        <option value="one">Information Technology</option>
                        <option value="two">Information System</option>
                        <option value="three">Computer Science</option>
                    </select>
                </div>
                <button type="submit">Submit</button>
            </form>
        </div>

        <div class="container" id="otp-container" style="display: none;">
            <h1>OTP Verification</h1>
            <form id="otp-form">
                <button type="button" class="back-button">←</button>
                <div class="form-group">
                    <label for="school-id">School Id</label>
                    <input type="text" id="school-id" name="school-id" placeholder="Enter your School Id" required>
                </div>
                <button type="submit">Send OTP</button>
            </form>
        </div>

        <div class="container" id="otp-code-container" style="display: none;">
            <h1>OTP Verification</h1>
            <form id="otp-code-form">
                <button type="button" class="back-button">←</button>
                <p class="otp-message">We sent a code to your account <span id="user-email"></span></p>
                <div class="form-group">
                    <label for="otp-code">OTP Code</label>
                    <input type="text" id="otp-code" name="otp-code" placeholder="Enter OTP Code" required>
                </div>
                <button type="submit">Verify</button>
            </form>
            <p class="resend-link"><a href="#" id="resend-otp">Didn't get a code? Resend</a></p>
        </div>
    </div>

    <script>
        // Debugging: Confirm script is loaded
        console.log('Script loaded');

        // Store email for OTP code container
        let userEmail = '';

        // Registration form submission
        const regForm = document.getElementById('registration-form');
        if (regForm) {
            regForm.addEventListener('submit', (e) => {
                e.preventDefault();
                console.log('Registration form submitted');
                userEmail = document.getElementById('email').value; // Capture email
                const regContainer = document.getElementById('registration-container');
                const otpContainer = document.getElementById('otp-container');
                if (regContainer && otpContainer) {
                    regContainer.style.display = 'none';
                    otpContainer.style.cssText = 'display: block !important;';
                    console.log('Toggled to OTP container');
                } else {
                    console.error('Container(s) not found:', { regContainer, otpContainer });
                }
            });
        } else {
            console.error('Registration form not found');
        }

        // OTP (School Id) form submission
        const otpForm = document.getElementById('otp-form');
        if (otpForm) {
            otpForm.addEventListener('submit', (e) => {
                e.preventDefault();
                console.log('OTP form submitted');
                const otpContainer = document.getElementById('otp-container');
                const otpCodeContainer = document.getElementById('otp-code-container');
                if (otpContainer && otpCodeContainer) {
                    otpContainer.style.display = 'none';
                    otpCodeContainer.style.cssText = 'display: block !important;';
                    document.getElementById('user-email').textContent = userEmail; // Display email
                    console.log('Toggled to OTP code container');
                } else {
                    console.error('Container(s) not found:', { otpContainer, otpCodeContainer });
                }
            });
        } else {
            console.error('OTP form not found');
        }

        // OTP code form submission
        const otpCodeForm = document.getElementById('otp-code-form');
        if (otpCodeForm) {
            otpCodeForm.addEventListener('submit', (e) => {
                e.preventDefault();
                console.log('OTP code form submitted');
                alert('OTP Code Verified: ' + document.getElementById('otp-code').value);
            });
        } else {
            console.error('OTP code form not found');
        }

        // Resend OTP link
        const resendLink = document.getElementById('resend-otp');
        if (resendLink) {
            resendLink.addEventListener('click', (e) => {
                e.preventDefault();
                console.log('Resend OTP clicked');
                alert('Resending OTP to ' + userEmail);
                // Optionally return to School Id container or call backend
            });
        } else {
            console.error('Resend link not found');
        }
    </script>
</body>
</html>
