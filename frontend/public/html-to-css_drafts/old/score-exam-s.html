<!DOCTYPE html>

<head>
   
    <title>final exam</title>
    <link rel="stylesheet" href="StudentScoreBoardStyle.css">
</head>
<body>
    <div class="student-s-exam-wrapper">
        <div class="student-s-exam-results-card">
            <div class="student-s-exam-header">
                <h1 class="student-s-exam-title">Network Configuration – Final Exam</h1>
                <img src="img/correct.png" alt="Checkmark" class="student-s-checkmark-icon">
            </div>

            <div class="student-s-score-section">
                <div class="student-s-score-display">44/50</div>
            </div>

            <div class="student-s-student-info">
                <div class="student-s-student-label">Student:</div>
                <div class="student-s-student-name">Alex Johnson</div>
                <div class="student-s-student-id">202219008</div>
            </div>

            <div class="student-s-exam-details">
                <div class="student-s-detail-box">
                    <div class="student-s-detail-label">Total Questions</div>
                    <div class="student-s-detail-value">50</div>
                </div>
                <div class="student-s-detail-box">
                    <div class="student-s-detail-label">Time Taken</div>
                    <div class="student-s-detail-value">1h 12m</div>
                </div>
            </div>

            <div class="student-s-submission-message">
                Your responses were submitted.
            </div>

            <button class="student-s-dashboard-button">
                RETURN TO DASHBOARD
            </button>
        </div>
    </div>
</body>
</html>
