<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Home</title>
    <link rel="stylesheet" href="super-admin-account-settings-account-deletion.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- START: WHOLE -->
<div class="super-admin-account-settings-whole">




<!-- ITONG SIDEBAR HINDI MABABAGO CLASS NAME, KASE NASA LOOB NAMAN SILA LAHAT NG ACCOUNT SETTING --> 

    <!-- START: SIDEBAR--> 
      <div class="super-admin-account-settings-sidebar"> <!-- nilagyan ko ng (super-admin-account-settings), yung sa iba rin halos nilagyan ko lng -->

      <!-- START: sidebar-image -->  
      <div class="super-admin-analytics-sidebar-image">
        <img src="insys4.PNG" alt="Sidebar Image">
      </div>
      <!-- END: sidebar-image -->


      <!-- START: sidebar-buttons -->
      <div class="super-admin-account-settings-sidebar-buttons">
        <h1 class="super-admin-account-settings-sidebar-title">Tools</h1>
        <button class="super-admin-account-seetings-sidebar-btn"><i class="fas fa-chart-bar"></i> Dashboard</button>
        <button class="super-admin-account-seetings-sidebar-btn"><i class="fa-solid fa-chart-simple"></i> Admin Analytics</button>
        <button class="super-admin-account-seetings-sidebar-btn"><i class="fa-solid fa-users"></i> Manage Accounts</button>
        <button class="super-admin-account-seetings-sidebar-btn"><i class="fa-solid fa-sliders"></i> System Settings</button>
        <button class="super-admin-account-seetings-sidebar-btn active"><i class="fa-solid fa-gear"></i> Account Settings</button>
      </div>
      <!-- END: sidebar-buttons -->


      <!-- START: sidebar-profile-container -->
      <div class="super-admin-account-settings-sidebar-profile-container">
        <i class="fa-solid fa-user"></i>
        <div class="super-admin-account-seetings-sidebar-profile-info">
          <div class="super-admin-account-seetings-sidebar-profile-name">Corazon Bagang</div>
          <div class="super-admin-account-seetings-sidebar-profile-title">System Admin</div>
        </div>
      </div>
      <!-- END: sidebar-profile-container -->
    </div>
    <!-- END: super-admin-sidebar -->




          <!-- START: USER SETTINGS OUTER CONTAINER -->
          <div class="user-settings-outer-container">

                <!-- START: USER SETTINGS INNER CONTAINER ONE -->   <!-- pinalitan ko rin to name kahit parehas lng sila kase may (active) akong ginagamit e-->
                <div class="user-settings-inner-container-one-account-deletion">     <!-- basta dinagdagan ko lng ng ("-account-deletion") sa dulo yung orig na ni-name mo--> 
                  <div class="user-settings-account-info-account-deletion">Account Information</div>
                  <div class="user-settings-change-password-account-deletion">Change Password</div>  
                  <div class="user-settings-account-deletion-account-deletion active">Account Deletion</div> <!-- ito yung active -->
                </div>
                <!-- END: USER SETTINGS INNER CONTAINER ONE -->


                                           
                     <!-- START: ACCOUNT CONTROL SECTION -->
                      <div class="super-admin-account-deletion-account-control-container">
                        <h3>Account Control</h3>

                        <!-- PASSWORD VERIFY -->
                        <div class="super-admin-account-deletion-account-input">
                          <input type="password" placeholder="Enter current password" />
                          <button>Verify Password</button>
                        </div>

                        <!-- MESSAGE -->
                         <p>[message]</p>

                        <!-- DELETE BUTTON -->
                        <div class="super-admin-account-deletion-account-button">
                          <button>Delete Account</button>
                        </div>
                      </div>
                      <!-- END: ACCOUNT CONTROL SECTION -->


              </div> 
              <!-- START: USER SETTINGS OUTER CONTAINER -->

         </div>
        <!-- END: WHOLE -->


</head>
    </body>
