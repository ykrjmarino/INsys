<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Choice</title>
    <link rel="stylesheet" href="student-examination-multiple-choice.css">
</head>
<body>
    <!--start whole-->
    <div class="student-exam-whole">
        <div class="student-exam-header">
            <div class="student-exam-left-side">
                <button><</button> 
                <p>Question 1/50</p> <!-- paragraph nlng nilagay di ko alam gagmitin haha-->
            </div>
            <div class="student-exam-right-side">

            </div>
        </div>


    <!--start exam container-->
        <div class="student-exam-container">

            <!--start questiion container-->
            <div class="student-exam-box">
                <p>How are you?</p>  <!-- paragraph nlng nilagay di ko alam gagmitin haha-->
            </div>
            <!--end question container-->

            <!--timer-->
            <div class="student-exam-timer-container">
                <div id="student-exam-timer"></div>
            </div>

            <!--points-->
            <div class="student-exam-points">
                <p>2 points*</p>  <!-- paragraph nlng nilagay di ko alam gagmitin haha-->
            </div>

            <!--start option container-->
            <div class="student-exam-option-container">
                <div class="option-pair">
                    <input type="radio" name="exam" value="option1" id="option1">
                    <label for="option1">I'm Fine</label>
                </div>
                <div class="option-pair">
                    <input type="radio" name="exam" value="option2" id="option2">
                    <label for="option2">Barely Alive</label>
                </div>
                <div class="option-pair">
                    <input type="radio" name="exam" value="option3" id="option3">
                    <label for="option3">Harian</label>
                </div>
                <div class="option-pair">
                    <input type="radio" name="exam" value="option4" id="option4">
                    <label for="option4">All Of The Above</label>
                </div>
            </div>
            <!--end option container-->
            
            
        <!--end exam container-->
        </div>    

        <div class="student-exam-button-container">
            <button>Next</button>
        </div>


    </div>
    <!--end whole-->



    <script>
        const FULL_DASH_ARRAY = 283;
        const WARNING_THRESHOLD = 10;
        const ALERT_THRESHOLD = 5;

        const COLOR_CODES = {
            info: { color: "green" },
            warning: { color: "orange", threshold: WARNING_THRESHOLD },
            alert: { color: "red", threshold: ALERT_THRESHOLD }
        };

        const TIME_LIMIT = 60; 
        let timePassed = 0;
        let timeLeft = TIME_LIMIT;
        let timerInterval = null;
        let remainingPathColor = COLOR_CODES.info.color;

        document.getElementById("student-exam-timer").innerHTML = `
            <div class="base-timer">
                <svg class="base-timer__svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <g class="base-timer__circle">
                        <circle class="base-timer__path-elapsed" cx="50" cy="50" r="45"></circle>
                        <path
                            id="base-timer-path-remaining"
                            stroke-dasharray="283"
                            class="base-timer__path-remaining ${remainingPathColor}"
                            d="
                                M 50, 50
                                m -45, 0
                                a 45,45 0 1,0 90,0
                                a 45,45 0 1,0 -90,0
                            "
                        ></path>
                    </g>
                </svg>
                <span id="base-timer-label" class="base-timer__label">${formatTime(timeLeft)}</span>
            </div>
        `;

        startTimer();

        function onTimesUp() {
            clearInterval(timerInterval);
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timePassed += 1;
                timeLeft = TIME_LIMIT - timePassed;
                document.getElementById("base-timer-label").innerHTML = formatTime(timeLeft);
                setCircleDasharray();
                setRemainingPathColor(timeLeft);

                if (timeLeft === 0) {
                    onTimesUp();
                }
            }, 1000);
        }

        function formatTime(time) {
            const minutes = Math.floor(time / 60);
            let seconds = time % 60;
            if (seconds < 10) seconds = `0${seconds}`;
            return `${minutes}:${seconds}`;
        }

        function setRemainingPathColor(timeLeft) {
            const { alert, warning, info } = COLOR_CODES;
            const path = document.getElementById("base-timer-path-remaining");
            if (timeLeft <= alert.threshold) {
                path.classList.remove(warning.color);
                path.classList.add(alert.color);
            } else if (timeLeft <= warning.threshold) {
                path.classList.remove(info.color);
                path.classList.add(warning.color);
            }
        }

        function calculateTimeFraction() {
            const rawTimeFraction = timeLeft / TIME_LIMIT;
            return rawTimeFraction - (1 / TIME_LIMIT) * (1 - rawTimeFraction);
        }

        function setCircleDasharray() {
            const circleDasharray = `${(calculateTimeFraction() * FULL_DASH_ARRAY).toFixed(0)} 283`;
            document.getElementById("base-timer-path-remaining").setAttribute("stroke-dasharray", circleDasharray);
        }
    </script>
</body>
</html>
