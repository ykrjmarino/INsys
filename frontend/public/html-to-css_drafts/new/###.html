
      {!isVerified ? (
        !sentOTP ? (
          <div className='page-s-registration'>
            <div className="container" id="otp-container" >
              <h1>Email Verification</h1>
              <form id="otp-form">
                <button className="back-button" label="←" onClick={() => navigate(-1)}/>
                <div className="form-group">
                  <label>School Id</label>
                  <InputField 
                    name="username"
                    id="school-id"
                    value={formRegister.username} 
                    onChange={handleChange}
                    placeholder="Enter your School Id" 
                    disabled={isVerified}
                    required
                  />
                </div>
                <Button type="button" onClick={handleSendOtp} label='Send OTP' disabled={isVerified}/>
              </form>
            </div>
          </div>
        ) : (
          <div className='page-s-registration'>
            <div className='container' id='otp-code-container'>
              <h1>OTP Verification</h1>
              <form id="otp-code-form">
                <button type="button" className="back-button" label="←" onClick={() => setSentOTP(false)}/>
                <p className="otp-message">We sent a code to your account <span id="user-email"></span></p>
                <div className="form-group">
                  <label>OTP Code</label>
                  <InputField
                    name="code" //otp
                    id="otp-code"
                    value={code}
                    onChange={(e) => setCode(e.target.value)}
                    placeholder="Enter OTP"
                    disabled={isVerified}
                  />
                </div>
                <Button className="verify-button" onClick={handleVerifyOtp} label='Verify' disabled={isVerified}/>
              </form>
  
              
              <p className="resend-link">
                <span id="resend-otp" onClick={handleSendOtp}>
                  Didn't get a code? Resend
                </span>
              </p>
              
              
            </div>
          </div>
        )
      ) : (
        <div className='page-s-registration'>
          <div className="container" id="registration-container" >
          <h1> Registration Form </h1>
          <form id="registration-form" onSubmit={handleSubmit}>  
            <div className="form-group">
              <label>Email</label>
              <InputField 
                name="email"
                id="email"
                type="email"
                value={`${formRegister.username}@pampangastateu.edu.ph`}
                placeholder="Enter Student ID"
                disabled={true}
              /> 
            </div>
            <div className="form-group">
              <label>Password</label>
              <InputField 
                name="password"
                id="password" 
                type="password"
                value={formRegister.password}
                onChange={handleChange}
                placeholder="Enter your password"
              /> 
            </div>
            <div className="form-group">
              <label>Re-type Password</label>
              <InputField 
                name="retypePassword"
                id="retype-password"
                type="password"
                value={formRegister.retypePassword}
                onChange={handleChange}
                placeholder="Re-type your password"
              /> 
            </div>
            

            <div className="name-group">
              <div className="form-group">
                <label>First Name</label>
                <InputField 
                  name="firstName"
                  id="first-name" 
                  value={formRegister.firstName}
                  onChange={handleChange}
                  placeholder="Enter your first name"
                /> 
              </div>
              <div className="form-group">
                <label>Last Name</label>
                <InputField 
                  name="lastName"
                  id="last-name" 
                  value={formRegister.lastName}
                  onChange={handleChange}
                  placeholder="Enter your last name"
                />
              </div>
              <div className="form-group">
                <label>Middle Initial</label>
                <InputField 
                  name="middleInitial"
                  id="middle-initial" 
                  value={formRegister.middleInitial}
                  onChange={handleChange}
                  placeholder="Enter your middle initial, e.g., R"
                  maxLength={1}
                />
              </div>
              
            </div>

            <RadioButtonGender
              divClassName="form-group"
              label="Gender"
              name="userGender"
              value={formRegister.userGender}
              onChange={handleChange}
              options={[
                { label: "Male", value: "Male" },
                { label: "Female", value: "Female" },
                { label: "Other", value: "Other" }
              ]}
            />

            <SelectField
              label="College Department"
              name="college"
              id="options"  
              value={formRegister.college}
              onChange={handleChange}
              options={[
                { label: "CCS", value: "CCS" },
                { label: "CEA", value: "CEA" },
                { label: "CBA", value: "CBA" },
                { label: "CHM", value: "CHM" },
                { label: "GA", value: "GA" }
              ]}
            />
            <br /> <br />
            <Button className="submit-register-btn" type="submit" label='Submit Registration'/>
            {/* triggers <form onSubmit={handleSubmit}/> */}
          </form>
          </div>
        </div>
      )}











      <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="public-register.css" />

  />
</head>
<body>

  <div className="register-whole">

        <div id="stars"></div>
        <div id="stars2"></div>
        <div id="stars3"></div>

      <!--side design start-->
    <div className="register-side-design">
        <img src="wait2.PNG" alt="Sidebar Logo">
        <label>Already Have An Account</label>
        <button className="registration-login-option">Login</button>
    </div>
          <!--side design end -->


    <!--start whole form -->  <!-- kaya may pa ganyan, kase nilabas  ko yung button-->
    <div className="registration-whole-form">
        

        <div className="registration-top-label">
          <button className="registration-back-btn" onClick={() => navigate(-1)}><i className="fa-solid fa-arrow-left"></i></button>
        </div>


        <div className="reigistration-main-label">
            <label>Register Your Account</label>  
        </div>
        
      <!--start progress bar -->
      <div className="registration-progress-bar">
        <ul id="progressbar">
          <li className="active"><strong>Register</strong></li>

          <li><strong>Verify</strong></li>
        </ul>
      </div>

      <!--start registration -->
      <div className="registration-form"  id="registration-form">

                
            <form id="registration-form" onSubmit={handleSubmit}>

                    <label htmlFor="email">Email</label>
                    <InputField 
                      name="email"
                      id="email"
                      type="email"

                    /> 
                </div>


                <div className="registration-form-group">
                    <label htmlFor="password">Password</label>
                     <InputField 
                        name="password"
                        id="password"

                      /> 
                </div>


                <div className="registration-form-group">
                    <label htmlFor="retype-password">Retype Password</label>
                    <InputField 
                      name="retypePassword"
                      id="retype-password"
                      type="password"
                      value={formRegister.retypePassword}

                      placeholder="Re-type your password"

                </div>


                <div className="registration-name-group">
                    <div className="registration-form-group">
                        <label htmlFor="first-name">First Name</label>
                        <InputField 
                          name="firstName"
                          id="first-name" 
                          value={formRegister.firstName}
                          onChange={handleChange}
                          placeholder="Enter your first name"
                          require
                        /> 
                    </div>
                    <div className="registration-form-group">
                        <label htmlFor="last-name">Last Name</label>
                        <InputField 
                          name="lastName"
                          id="last-name" 
                          value={formRegister.lastName}
                          onChange={handleChange}
                          placeholder="Enter your last name"
                          require
                        />
                    </div>
                    <div className="registration-form-group">
                        <label htmlFor="last-name">Last Name</label>
                        <label>Middle Initial</label>
                        <InputField 
                          name="middleInitial"
                          id="middle-initial" 
                          value={formRegister.middleInitial}
                          onChange={handleChange}
                          placeholder="Enter your middle initial, e.g., R"
                          maxLength={1}
                          require
                        />
                    </div>
                </div>

                <RadioButtonGender
                  divClassName="registration-form-group"
                  label="Gender"
                  name="userGender"
                  value={formRegister.userGender}
                  onChange={handleChange}
                  options={[
                    { label: "Male", value: "Male" },
                    { label: "Female", value: "Female" },
                    { label: "Other", value: "Other" }
                  ]}
                />



                <div className="registration-form-group">
                    <SelectField
                      label="College Department"
                      name="college"
                      id="options"  
                      value={formRegister.college}
                      onChange={handleChange}
                      options={[
                        { label: "CCS", value: "CCS" },
                        { label: "CEA", value: "CEA" },
                        { label: "CBA", value: "CBA" },
                        { label: "CHM", value: "CHM" },
                        { label: "GA", value: "GA" }
                      ]}
                    />
                </div>

                      
          
         
        </div>
        <!--end registration-->


        <!--start otp conatiner(2) -->
        <div className="registration-container" id="otp-container" style="display: none;">
            <form id="otp-form" onSubmit={handleSendOtp}>
    
                <div className="registration-form-group">
                    <label htmlFor="school-id">School Id</label>
                    <InputField 
                    name="username"
                    id="school-id"
                    value={formRegister.username} 
                    onChange={handleChange}
                    placeholder="Enter your School Id" 
                    disabled={isVerified}
                    required
                  />
                </div>

                <Button type="submit" label='Send OTP' disabled={isVerified}/>
               
            </form>
        </div>
        <!--end otp conatiner(2) -->


        <!--start otp code container(3) -->
         <div className="registration-container" id="otp-code-container" style="display: none;">
            <form id="otp-code-form" onSubmit={handleVerifyOtp}>
                <label className= "registration-otp-message">We sent a code to your account <span id="user-email"></span></label>
                <div className="registration-form-group">
                    <label htmlFor="otp-code">OTP Code</label>
                    <InputField
                        name="code" //otp
                        id="otp-code"
                        value={code}
                        onChange={(e) => setCode(e.target.value)}
                        placeholder="Enter OTP"
                        disabled={isVerified}
                    />
                </div>
                <Button className="verify-button" type="submit" label='Verify' disabled={isVerified}/>
            </form>
            <label className="registration-resend-link"><a  onClick={handleSendOtp} id="resend-otp">Didn't get a code? Resend</a></label>
        </div>
        <!--end otp conatiner(3) -->


              <Button className="registration-next-btn" type="submit" label='Submit Registration'/>
            </form>
      </div>
      <!--end whole form -->
  </div>
  <!--register whole end( -->
