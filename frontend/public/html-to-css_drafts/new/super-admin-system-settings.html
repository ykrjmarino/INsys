<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings</title>
    <link rel="stylesheet" href="super-admin-system-settings.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- START: WHOLE -->
    <div class="super-admin-system-settings-whole">

        <!-- START: SIDEBAR -->
        <div class="super-admin-system-settings-sidebar">

            <div class="super-admin-analytics-sidebar-image">
                <img src="insys4.PNG" alt="Sidebar Image">
            </div>

            <div class="super-admin--system-settings-sidebar-buttons">
                <h1 class="super-admin--system-settings-sidebar-title">Tools</h1>
                <button class="super-admin-system-settings-sidebar-btn"><i class="fas fa-chart-bar"></i> Dashboard</button>
                <button class="super-admin-system-settings-sidebar-btn"><i class="fa-solid fa-chart-simple"></i> Admin Analytics</button>
                <button class="super-admin-system-settings-sidebar-btn"><i class="fa-solid fa-users"></i> Manage Accounts</button>
                <button class="super-admin-system-settings-sidebar-btn active"><i class="fa-solid fa-sliders"></i> System Settings</button>
                <button class="super-admin-system-settings-sidebar-btn"><i class="fa-solid fa-gear"></i> Account Settings</button>
            </div>

            <div class="super-admin-system-settings-sidebar-profile-container">
                <i class="fa-solid fa-user"></i>
                <div class="super-admin-system-settings-sidebar-profile-info">
                    <div class="super-admin-system-settings-sidebar-profile-name">Corazon Bagang</div>
                    <div class="super-admin-system-settings-sidebar-profile-title">System Admin</div>
                </div>
            </div>
        </div>
        <!-- END: SIDEBAR -->

        <!-- START: MAIN CONTENT -->
        <div class="super-admin-system-settings-main-container">
            <h2>System Settings</h2>

            <!-- WARNING TEXT -->
            <p class="super-admin-system-settings-warning"> <i class="fa-solid fa-triangle-exclamation"></i>
                These actions are <strong>permanent</strong> and <strong>cannot be undone</strong>. Proceed only if you fully understand the consequences.
            </p>

            <!-- TWO BUTTONS IN ONE ROW -->
            <div class="super-admin-system-settings-buttons-row">
                <div class="super-admin-system-settings-button">
                    <h1>Delete Old Data</h1>
                    <p>Remove exams and logs older than 7 months</p>
                </div>

                <div class="super-admin-system-settings-button">
                    <h1>Clear All System Data</h1>
                    <p>Deletes all exams, student submissions, and logs.</p>
                </div>
            </div>
        </div>
        <!-- END: MAIN CONTENT -->

    </div>
    <!-- END: WHOLE -->

</body>
</html>
