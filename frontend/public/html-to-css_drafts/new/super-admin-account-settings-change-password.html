<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Home</title>
    <link rel="stylesheet" href="super-admin-account-settings-change-password.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- START: WHOLE -->
<div class="super-admin-account-settings-whole">




<!-- ITONG SIDEBAR HINDI MABABAGO CLASS NAME, KASE NASA LOOB NAMAN SILA LAHAT NG ACCOUNT SETTING --> 

    <!-- START: SIDEBAR--> 
      <div class="super-admin-account-settings-sidebar"> <!-- nilagyan ko ng (super-admin-account-settings), yung sa iba rin halos nilagyan ko lng -->

      <!-- START: sidebar-image -->  
      <div class="super-admin-analytics-sidebar-image">
        <img src="insys4.PNG" alt="Sidebar Image">
      </div>
      <!-- END: sidebar-image -->


      <!-- START: sidebar-buttons -->
      <div class="super-admin-account-settings-sidebar-buttons">
        <h1 class="super-admin-account-settings-sidebar-title">Tools</h1>
        <button class="super-admin-account-seetings-sidebar-btn"><i class="fas fa-chart-bar"></i> Dashboard</button>
        <button class="super-admin-account-seetings-sidebar-btn"><i class="fa-solid fa-chart-simple"></i> Admin Analytics</button>
        <button class="super-admin-account-seetings-sidebar-btn"><i class="fa-solid fa-users"></i> Manage Accounts</button>
        <button class="super-admin-account-seetings-sidebar-btn"><i class="fa-solid fa-sliders"></i> System Settings</button>
        <button class="super-admin-account-seetings-sidebar-btn active"><i class="fa-solid fa-gear"></i> Account Settings</button>
      </div>
      <!-- END: sidebar-buttons -->


      <!-- START: sidebar-profile-container -->
      <div class="super-admin-account-settings-sidebar-profile-container">
        <i class="fa-solid fa-user"></i>
        <div class="super-admin-account-seetings-sidebar-profile-info">
          <div class="super-admin-account-seetings-sidebar-profile-name">Corazon Bagang</div>
          <div class="super-admin-account-seetings-sidebar-profile-title">System Admin</div>
        </div>
      </div>
      <!-- END: sidebar-profile-container -->
    </div>
    <!-- END: super-admin-sidebar -->




          <!-- START: USER SETTINGS OUTER CONTAINER -->
          <div class="user-settings-outer-container">

                <!-- START: USER SETTINGS INNER CONTAINER ONE -->   <!-- pinalitan ko rin to name kahit parehas lng sila kase may (active) akong ginagamit e-->
                <div class="user-settings-inner-container-one-change-password">     <!-- basta dinagdagan ko lng ng ("-change-password") sa dulo yung orig na ni-name mo--> 
                  <div class="user-settings-account-info-change-password">Account Information</div>
                  <div class="user-settings-change-password-change-password active">Change Password</div>  <!-- ito yung active -->
                  <div class="user-settings-account-deletion-change-password">Account Deletion</div>
                </div>
                <!-- END: USER SETTINGS INNER CONTAINER ONE -->


                                            
                        <!-- START: PASSWORD MANAGEMENT SECTION -->
                        <!-- IMPORTANT: This section’s elements must stay together as a unit -->
                        <div class="super-admin-account-seetings-change-password-container">
                        <h3>Password Management</h3>

                        <p>[message]</p> <!-- This will show feedback messages dynamically -->

                        <form>
                            <div class="super-admin-account-settings-change-password-form">
                            <label for="currentPassword">Current Password:</label><br />
                            <input type="password" id="currentPassword" name="currentPassword" required />
                            </div>

                            <div class="super-admin-account-settings-change-password-input">
                            <label for="newPassword">New Password:</label><br />
                            <input type="password" id="newPassword" name="newPassword" required />
                            </div>

                            <div class="super-admin-account-settings-change-password-input">
                            <label for="confirmNewPassword">Confirm New Password:</label><br />
                            <input type="password" id="confirmNewPassword" name="confirmNewPassword" required />
                            </div>

                            <a class="forgot-password" href="/account-settings/forgot-password">Forgot Password?</a>
                            <br />
                            <button type="submit">Update Password</button>
                        </form>
                        </div>
                        <!-- END: PASSWORD MANAGEMENT SECTION -->




              </div> 
              <!-- END: USER SETTINGS OUTER CONTAINER TWO -->

         </div>
        <!-- END: WHOLE -->


</head>
    </body>
