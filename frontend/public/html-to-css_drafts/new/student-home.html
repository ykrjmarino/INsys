<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Home</title>
    <link rel="stylesheet" href="student-home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <!-- background start -->
    <div class="student-home-bg">
        <div class="student-home-grid-bg"></div>
        
        <!-- start whole -->
        <div class="student-home-whole">

            <!--header-->
            <div class="student-home-header"></div>
             <!--header-->

             <!--sidebar hamburger-->
            <input type="checkbox" class="student-home-open-sidebar-menu" id="student-home-open-sidebar-menu">
            <label for="student-home-open-sidebar-menu" class="student-home-sidebar-icon-toggle">
                <div class="s-h-spinner s-h-diagonal s-h-part-1"></div>
                <div class="s-h-spinner s-h-horizontal"></div>
                <div class="s-h-spinner s-h-diagonal s-h-part-2"></div>
            </label>
            <!--sidebar hamburger-->

            <!--sidebar-->
            <div id="student-home-sidebar-menu">
                <div class="sidebar-logo">
                    <img src="insys3.PNG" alt="Sidebar Logo">
                </div>

            <div class="student-home-sidebar-buttons">

                <h1 class="student-home-sidebar-title">Tools</h1>
                <button class="student-home-sidebar-btn"><i class="fas fa-chart-bar"></i> Dashboard</button>
                <button class="student-home-sidebar-btn"><i class="fa-solid fa-clock-rotate-left"></i>History</button>
                <button class="student-home-sidebar-btn"><i class="fa-solid fa-gear"></i> Settings</button>

            </div>


            <div class="student-home-logout">
                    <a href="#" class="student-home-logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
                </div>
            </div>
             <!--sidebar-->

            <!-- start code container -->
            <div class="student-home-code-container">
                <div class="student-home-container-logo">
                    <img src="wait.PNG" alt="logo">
                </div>
                <div class="student-home-input">
                    <label for="section">Section</label>
                    <input type="text" id="section" placeholder="Enter your section">
                </div>
                <div class="student-home-input">
                    <label for="code">Code</label>
                    <input type="text" id="code" placeholder="Enter your exam code">
                </div>
                <button class="student-home-exam-button">Take Exam</button>
            </div>
            <!-- end code container -->

          
        </div>
        <!-- end student-home-whole -->
    </div>
    <!-- background  end -->
  

<!-- dito nlng maiksi lng din naman-->
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const settingsToggle = document.querySelector(".student-home-settings-toggle");
        const settingsDropdown = document.querySelector(".student-home-settings-dropdown");

        settingsToggle.addEventListener("click", (e) => {
            e.preventDefault();
            settingsDropdown.classList.toggle("active");
        });
    });
    </script>
</body>
</html>
