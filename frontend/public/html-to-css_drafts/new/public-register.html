<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step Progress Bar</title>
  <link rel="stylesheet" href="public-register.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
  />
</head>
<body>

  <div class="register-whole">

        <div id="stars"></div>
        <div id="stars2"></div>
        <div id="stars3"></div>

      <!--side design start-->
    <div class="register-side-design">
        <img src="wait2.PNG" alt="Sidebar Logo">
        <label>Already Have An Account</label>
        <button class="registration-login-option">Login</button>
    </div>
          <!--side design end -->


    <!--start whole form -->  <!-- kaya may pa ganyan, kase nilabas  ko yung button-->
    <div class="registration-whole-form">
        

        <div class="registration-top-label">
          <button class="registration-back-btn"><i class="fa-solid fa-arrow-left"></i></button>
        </div>


        <div class="reigistration-main-label">
            <label>Register Your Account</label>  
        </div>
        
      <!--start progress bar -->
      <div class="registration-progress-bar">
        <ul id="progressbar">
          <li class="active"><strong>Register</strong></li>
          <li><strong>OTP Code</strong></li>
          <li><strong>Verify</strong></li>
        </ul>
      </div>
      <!--end progress bar -->


      <!--start registration -->
      <div class="registration-form"  id="registration-form">

                
            <form id="registration-form" onSubmit={handleSubmit}>
                <div class="registration-form-group">
                    <label htmlFor="email">Email</label>
                    <InputField 
                      name="email"
                      id="email"
                      type="email"
                      value={`${formRegister.username}@pampangastateu.edu.ph`}
                      placeholder="Enter Student ID"
                      disabled={true}
                    /> 
                </div>


                <div class="registration-form-group">
                    <label htmlFor="password">Password</label>
                     <InputField 
                        name="password"
                        id="password" 
                        type="password"
                        value={formRegister.password}
                        onChange={handleChange}
                        placeholder="Enter your password"
                      /> 
                </div>


                <div class="registration-form-group">
                    <label htmlFor="retype-password">Retype Password</label>
                    <InputField 
                      name="retypePassword"
                      id="retype-password"
                      type="password"
                      value={formRegister.retypePassword}
                      onChange={handleChange}
                      placeholder="Re-type your password"
                    /> 
                </div>


                <div class="registration-name-group">
                    <div class="registration-form-group">
                        <label for="first-name">First Name</label>
                        <InputField 
                          name="firstName"
                          id="first-name" 
                          value={formRegister.firstName}
                          onChange={handleChange}
                          placeholder="Enter your first name"
                          require
                        /> 
                    </div>
                    <div class="registration-form-group">
                        <label for="last-name">Last Name</label>
                        <InputField 
                          name="lastName"
                          id="last-name" 
                          value={formRegister.lastName}
                          onChange={handleChange}
                          placeholder="Enter your last name"
                          require
                        />
                    </div>
                    <div class="registration-form-group">
                        <label for="last-name">Last Name</label>
                        <label>Middle Initial</label>
                        <InputField 
                          name="middleInitial"
                          id="middle-initial" 
                          value={formRegister.middleInitial}
                          onChange={handleChange}
                          placeholder="Enter your middle initial, e.g., R"
                          maxLength={1}
                          require
                        />
                    </div>
                </div>

                <RadioButtonGender
                  divClassName="registration-form-group"
                  label="Gender"
                  name="userGender"
                  value={formRegister.userGender}
                  onChange={handleChange}
                  options={[
                    { label: "Male", value: "Male" },
                    { label: "Female", value: "Female" },
                    { label: "Other", value: "Other" }
                  ]}
                />



                <div class="registration-form-group">
                    <SelectField
                      label="College Department"
                      name="college"
                      id="options"  
                      value={formRegister.college}
                      onChange={handleChange}
                      options={[
                        { label: "CCS", value: "CCS" },
                        { label: "CEA", value: "CEA" },
                        { label: "CBA", value: "CBA" },
                        { label: "CHM", value: "CHM" },
                        { label: "GA", value: "GA" }
                      ]}
                    />
                </div>

                      
          
         
        </div>
        <!--end registration-->


        <!--start otp conatiner(2) -->
        <div class="registration-container" id="otp-container" style="display: none;">
            <form id="otp-form">
    
                <div class="registration-form-group">
                    <label for="school-id">School Id</label>
                    <input type="text" id="school-id" name="school-id" placeholder="Enter your School Id" required>
                </div>
               
            </form>
        </div>
        <!--end otp conatiner(2) -->


        <!--start otp code container(3) -->
         <div class="registration-container" id="otp-code-container" style="display: none;">
            <form id="otp-code-form">
                <label class= "registration-otp-message">We sent a code to your account <span id="user-email"></span></label>
                <div class="registration-form-group">
                    <label for="otp-code">OTP Code</label>
                    <input type="text" id="otp-code" name="otp-code" placeholder="Enter OTP Code" required>
                </div>
            </form>
            <label class="registration-resend-link"><a href="#" id="resend-otp">Didn't get a code? Resend</a></label>
        </div>
        <!--end otp conatiner(3) -->


              <Button className="registration-next-btn" type="submit" label='Submit Registration'/>
            </form>
      </div>
      <!--end whole form -->
  </div>
  <!--register whole end( -->



<!--sa progress to-->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script>

    $(document).ready(function() {
  let current = 0;
  const steps = $("#progressbar li");
  const containers = [
    $("#registration-form"), 
    $("#otp-container"),     
    $("#otp-code-container")
  ];

  function updateProgress() {
    
    steps.removeClass("active");
    for (let i = 0; i <= current; i++) {
      $(steps[i]).addClass("active");
    }

   
    const progressPercent = (current / (steps.length - 1)) * 100;
    $("#progressbar").css("--progress-width", progressPercent + "%");


    containers.forEach(function(container, index) {
      if (index === current) {
        container.show();
      } else {
        container.hide();
      }
    });
  }

  $(".registration-next-btn").click(function() {
    if (current < steps.length - 1) {
      current++;
      updateProgress();
    }
  });

  $(".registration-back-btn").click(function() {
    if (current > 0) {
      current--;
      updateProgress();
    }
  });


  updateProgress();
});

  </script>

</body>
</html>
