

<!-- 1:: SEND CODE -->
    <!--start whole-->
    <div class="forget-pass-whole">
        <!--start bg-->
        <div id="forget-password-stars"></div>
        <div id="forget-password-stars2"></div>
        <div id="Forget-password-stars3"></div>
        <!--end bg-->


        <!--start forgert pass container-->
        <div class="forget-pass-whole-container">
            <button class="forget-password-back-btn"><i class="fa fa-arrow-left"></i></button>

            <label class="forget-password-label">Forgot Password</label>
            
            <div id="forget-password-container">
                <div class="forget-password-group">
                    <label for="email">Email</label>
                    <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter Email"
                    />

                    <button type="button" id="send-otp">Send OTP</button>

                    <label for="otp">OTP</label>
                    <input 
                    type="text" 
                    id="otp" 
                    name="otp" 
                    placeholder="Enter OTP"
                    />

                    <button type="button" id="verify-otp">Verify</button>
                </div>
            </div>
            
            <button class="forget-password-btn">Send code</button>
        </div>
        <!--end forget pass  container-->
    </div>
    <!--end whole-->

    <div id="forget-password-otp-code-container"> 
        <div class="forget-passoword-otp-code-group">

            <input type="text" id="code" name="code" placeholder="Enter Code" required> <!-- palitan mo nalang-->
        </div> 
    </div>
    <button class="forget-otp-code-btn">Verify</button>
        
    
<!-- 3:: CHANGE PASSWORD -->
  
    <div id="forget-password-change-password-container">
        <div class="forget-passoword-change-password-group">
            <label for="email">New Password</label>
            <input type="password" id="pass" name="pass" placeholder="Enter New Password" required> <!-- palitan mo nalang-->
        </div> 
    </div>
    <button class="forget-change-password-btn">Change Password</button>
